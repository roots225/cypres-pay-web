<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="35%" stop-color="#b70011" />
      <stop offset="100%" stop-color="#7f0910" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  
  <!-- Subtle Glass Bevel Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#glowGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.35" />

  <!-- Monogram Mark 'C' -->
  <path d="M 238 174 
           C 222 152 196 138 166 138 
           C 108 138 66 186 66 256 
           C 66 326 108 374 166 374 
           C 196 374 222 360 238 338 
           L 204 306 
           C 194 320 181 328 166 328 
           C 132 328 112 296 112 256 
           C 112 216 132 184 166 184 
           C 181 184 194 192 204 206 
           Z" 
        fill="#ffffff" />

  <!-- Monogram Mark 'P' -->
  <path d="M 268 142 
           L 366 142 
           C 410 142 442 170 442 214 
           C 442 258 410 286 366 286 
           L 316 286 
           L 316 370 
           L 268 370 
           Z
           M 316 186 
           L 316 242 
           L 362 242 
           C 386 242 396 230 396 214 
           C 396 198 386 186 362 186 
           Z" 
        fill="#ffffff" />

  <!-- Dynamic BNPL Pulse Accent Dot (Emerald Green representing successful approvals & payments) -->
  <circle cx="414" cy="370" r="26" fill="#10b981" stroke="#ffffff" stroke-width="6" />
</svg>
