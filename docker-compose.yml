services:
  # ── Service 1 : Laravel Application (PHP 8.3 FPM + Extensions)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cypress_pay_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: cypress_pay
      DB_USERNAME: cypress_user
      DB_PASSWORD: cypress_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./public/build:/var/www/html/public/build
    networks:
      - cypress_network
    depends_on:
      - db
      - redis

  # ── Service 2 : Nginx Web Server (Reverse Proxy & Static Files)
  web:
    image: nginx:alpine
    container_name: cypress_pay_web
    restart: unless-stopped
    ports:
      - "4231:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cypress_network
    depends_on:
      - app

  # ── Service 3 : MySQL 8.0 Database
  db:
    image: mysql:8.0
    container_name: cypress_pay_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cypress_pay
      MYSQL_USER: cypress_user
      MYSQL_PASSWORD: cypress_password
      MYSQL_ROOT_PASSWORD: root_cypress_password
    # ports:
    #   - "33066:3306"
    volumes:
      - cypress_mysql_data:/var/lib/mysql
    networks:
      - cypress_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_cypress_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Service 4 : Redis (Cache, Sessions & Queues)
  redis:
    image: redis:7-alpine
    container_name: cypress_pay_redis
    restart: unless-stopped
    # ports:
    #   - "63799:6379"
    volumes:
      - cypress_redis_data:/data
    networks:
      - cypress_network

  # ── Service 5 : Node.js (Vite Dev Server & Asset Compiler)
  node:
    image: oven/bun:latest #node:24-alpine
    container_name: cypress_pay_node
    restart: "no"
    working_dir: /var/www/html
    # ports:
    #   - "5173:5173"
    tty: true
    volumes:
      - .:/var/www/html
    networks:
      - cypress_network
    command: sh -c "bun install && bun run build"

  # ── Service 6 : Queue Worker (Background Jobs & Notifications)
  # queue:
  #   build:
  #     context: .
  #     dockerfile: docker/php/Dockerfile
  #   container_name: cypress_pay_queue
  #   restart: unless-stopped
  #   working_dir: /var/www/html
  #   volumes:
  #     - .:/var/www/html
  #   networks:
  #     - cypress_network
  #   command: php artisan queue:work redis --sleep=3 --tries=3
  #   depends_on:
  #     - app
  #     - redis

networks:
  cypress_network:
    driver: bridge

volumes:
  cypress_mysql_data:
    driver: local
  cypress_redis_data:
    driver: local
